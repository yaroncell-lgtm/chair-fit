<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="כושר בוקר">
<title>כושר בוקר מהכיסא</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="app.css?v=5">
</head>
<body>
<main id="who" hidden></main>
<div id="app" hidden></div>

<section id="player" hidden aria-label="אימון">
  <div class="p-top">
    <span class="phase" id="pPhase"></span><span class="muted" id="pStep"></span>
    <span class="grow"></span><span class="num" id="pTotal"></span>
    <button class="btn sm" id="pMusic">🎵<span class="lbl"> מוזיקה</span></button>
    <button class="btn sm" id="pPause" aria-label="השהיה">⏸<span class="lbl"> השהיה</span></button>
    <button class="btn sm" id="pSkip" aria-label="דילוג">⏭<span class="lbl"> דילוג</span></button>
  </div>
  <div class="p-side">
    <h1 id="pName"></h1>
    <div id="pMeta"></div>
    <ul id="pCues"></ul>
    <div id="pTip"></div>
    <div class="musc" id="pMus"></div>
    <div class="p-nums">
      <div class="ring" id="pRing"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="pRingFg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="pSec" class="num"></b></div>
      <div class="reps" id="pReps"><b id="pRep" class="num">0</b><span id="pRepT" class="num"></span><small>חזרות</small></div>
    </div>
    <div id="pNext"></div>
  </div>
  <div class="p-stage" id="pStage">
    <div class="fallback" id="pFb"></div>
    <img id="pPoster" alt="">
    <video id="vA" muted playsinline loop preload="auto"></video>
    <video id="vB" muted playsinline loop preload="auto"></video>
    <span class="stage-badge" id="pBadge" hidden></span>
    <span class="side-badge" id="pSideB" hidden></span>
    <div id="pFx"></div>
  </div>
  <div class="p-bar" id="pBar"></div>
  <div class="paused-ov" id="pPaused" hidden><div>
    <h2>הפסקה</h2>
    <button class="btn go big" id="pResume">▶ ממשיכים</button>
    <div class="row"><button class="btn" id="pSkip2">⏭ לתרגיל הבא</button><button class="btn" id="pExit">⏹ סיום האימון</button></div>
  </div></div>
</section>

<script src="ex.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
