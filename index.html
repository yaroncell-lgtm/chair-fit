<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="כושר בוקר">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>כושר בוקר מהכיסא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;700;800;900&display=swap">
<style>
/* Layout: one-screen training app, dark gym-floor ground. Volt = work/action, amber = rest/rewards, burn = working muscles. */
:root{
  --ink:#0d1214; --ink2:#141b1e; --ink3:#1c262a; --line:#29363b;
  --mist:#eef3f1; --mist2:#a7b6b1; --mist3:#71837d;
  --volt:#b8f15a; --volt-ink:#16210a; --amber:#ffb547; --amber-ink:#2e1d05; --burn:#ff5f3d; --clay:#ff7a5c;
  --body:#d3dcd8; --mat:#1f3b39;
  --f-display:"Rubik","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--mist);font-family:var(--f-body);font-size:17px;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:900}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--volt)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.view{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:18px 96px;max-width:760px;width:100%;margin:0 auto}
.muted{color:var(--mist2)}
.small{font-size:.88rem}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.label{font-size:.78rem;letter-spacing:.06em;color:var(--mist3);font-weight:800}
.panel{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:800;font-family:var(--f-display);background:var(--ink3);border:1px solid var(--line);min-height:48px}
.btn.primary{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.big-start{width:100%;padding:22px;font-size:1.7rem;border-radius:18px;flex-direction:column;gap:2px}
.big-start small{font-family:var(--f-body);font-weight:700;font-size:.95rem;opacity:.8}
.alt-starts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;padding:4px 10px;border-radius:999px;background:var(--ink3);border:1px solid var(--line);color:var(--mist2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-size:1.7rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .k{font-size:.82rem;color:var(--mist2)}
.bar{height:10px;border-radius:99px;background:var(--ink3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:99px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--mist3)}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;border:2px solid var(--line)}
.dot.full{background:var(--volt);border-color:var(--volt)}
.dot.half{background:linear-gradient(0deg,var(--volt) 55%,transparent 55%);border-color:var(--volt)}
.dot.mini{background:linear-gradient(0deg,var(--volt) 25%,transparent 25%);border-color:var(--volt)}
.dot.today{border-color:var(--amber)}
.dot.grace{border-style:dashed;border-color:var(--mist3)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--ink2);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{flex:1;max-width:190px;padding:12px 4px 10px;font-family:var(--f-display);font-weight:800;font-size:.92rem;color:var(--mist3);border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--mist);border-top-color:var(--volt)}
.contract{border:1px dashed var(--volt);border-radius:14px;padding:14px;font-size:1.05rem}
.contract b{color:var(--volt)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ink3);border:1px solid var(--line);cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--volt);flex:none;margin-top:2px}
input[type=text],input[type=time],select,textarea{font:inherit;color:var(--mist);background:var(--ink3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--volt)}
.field{display:flex;flex-direction:column;gap:6px}
.bul{padding-inline-start:20px;margin:0}
.bul li{margin-bottom:5px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale.three{grid-template-columns:repeat(3,1fr)}
.scale button{background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;color:var(--mist2);min-height:64px}
.scale button b{font-family:var(--f-display);font-size:1.3rem;color:var(--mist)}
.scale button[aria-pressed="true"]{background:var(--volt);color:var(--volt-ink);border-color:var(--volt)}
.scale button[aria-pressed="true"] b{color:var(--volt-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--ink2);opacity:.45}
.badge.on{opacity:1;border-color:var(--amber)}
.badge b{font-family:var(--f-display)}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--amber);color:var(--amber-ink);font-weight:800;padding:10px 18px;border-radius:12px;z-index:40;font-family:var(--f-display);max-width:90vw;text-align:center}
.table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.table th,.table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:.92rem}
.table th{color:var(--mist3);font-weight:800;font-size:.8rem}
.res{font-family:var(--f-display);font-weight:900}
.res.w{color:var(--volt)}.res.d{color:var(--amber)}.res.l{color:var(--clay)}
.belt{display:inline-block;width:42px;height:12px;border-radius:3px;vertical-align:middle;border:1px solid rgba(255,255,255,.25)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lib button{text-align:right;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lib .tag{font-size:.8rem;color:var(--mist3)}
.lib .th{display:block;width:100%;aspect-ratio:1.05;border-radius:9px;background:#f8f4ec no-repeat left center/200% auto;margin-bottom:6px}
.spark{display:flex;align-items:flex-end;gap:4px;height:70px}
.spark i{flex:1;background:var(--volt);border-radius:3px 3px 0 0;min-height:2px}
.spark i.neg{background:var(--clay)}

/* muscle map */
.mmap{width:100%;max-width:300px;height:auto;display:block}
.mmap .sil{fill:#25333a}
.mmap .m{fill:#33454c;transition:fill .3s}
.mmap .m.p{fill:var(--burn);animation:pulse 1.2s ease-in-out infinite}
.mmap .m.s{fill:#c8643f}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mmap .m.p{animation:none}}
.mnames{display:flex;flex-wrap:wrap;gap:6px}
.mnames span{font-size:.82rem;padding:3px 9px;border-radius:99px;border:1px solid var(--burn);color:#ffb3a1}
.mnames span.s{border-color:#7a4a3a;color:var(--mist2)}

/* ---------- player ---------- */
#player{position:fixed;inset:0;background:var(--ink);z-index:20;display:grid;grid-template-columns:1fr minmax(300px,36%);grid-template-rows:1fr auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#stage{background:#f8f4ec}
#hudL .lbl,#hudR .lbl{color:#6b5d4f!important}
#hudL .big{color:#1d2629}
#hudR .big{color:#d9481f!important}
#hudR .big small{color:#8a7b6b!important}
#ringTxt{color:#1d2629}
#restBanner{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#1d2629;color:#fff;border-radius:16px;padding:8px 18px;text-align:center;font-family:var(--f-display);box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:60%}
#restBanner .k{font-size:.85rem;color:var(--amber);font-weight:800}
#restBanner .n{font-size:clamp(1.1rem,2.6vw,2rem);font-weight:900;line-height:1.1}
#restBanner .t{font-size:clamp(.85rem,1.6vw,1.1rem);color:#cfd8d4}
@media (max-width:820px),(orientation:portrait){#restBanner{display:none}}
#side{display:flex;flex-direction:column;gap:10px;padding:18px 20px 10px;min-width:0;border-inline-start:1px solid var(--line);overflow:auto}
#phase{align-self:flex-start;font-family:var(--f-display);font-weight:900;font-size:.95rem;padding:4px 12px;border-radius:99px;background:var(--volt);color:var(--volt-ink)}
#phase.rest{background:var(--amber);color:var(--amber-ink)}
#phase.warm,#phase.cool{background:var(--ink3);color:var(--mist);border:1px solid var(--line)}
#exName{font-size:clamp(1.5rem,2.8vw,2.4rem);font-weight:900}
#exTarget{font-family:var(--f-display);font-weight:700;color:var(--volt);font-size:1.1rem}
#exRom{color:var(--mist2)}
#exCues{font-size:1rem}
#exWhy{color:var(--amber);font-size:.95rem}
#hudL{position:absolute;top:14px;inset-inline-end:16px;text-align:left;font-family:var(--f-display)}
#hudL .lbl{font-size:.95rem;color:var(--mist2);font-weight:700}
#hudL .big{font-size:clamp(3rem,8vw,6.5rem);font-weight:900;line-height:.95;font-variant-numeric:tabular-nums}
#hudR{position:absolute;top:14px;inset-inline-start:16px;font-family:var(--f-display)}
#hudR .lbl{font-size:.95rem;color:var(--mist2);font-weight:700}
#hudR .big{font-size:clamp(2.6rem,6.5vw,5.2rem);font-weight:900;line-height:.95;color:var(--volt);font-variant-numeric:tabular-nums}
#hudR .big small{font-size:.45em;color:var(--mist3)}
#ring{position:absolute;bottom:16px;inset-inline-start:16px;width:clamp(64px,10vw,110px);aspect-ratio:1}
#ring circle{fill:none;stroke-width:9}
#ring .bg{stroke:#ddd3c4}
#ring .fg{stroke:#4f9a12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
#ring.rest .fg{stroke:#e09a1c}
#ringTxt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(1.1rem,2.4vw,1.8rem);font-variant-numeric:tabular-nums}
#bigCount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:clamp(8rem,26vw,18rem);color:#e2492a;pointer-events:none;text-shadow:0 4px 30px rgba(255,255,255,.95)}
#segs{grid-column:1/-1;display:flex;gap:3px;padding:8px 16px 10px}
#segs i{flex:1;height:8px;border-radius:99px;background:var(--ink3);overflow:hidden;position:relative}
#segs i.r{flex:.45;opacity:.6}
#segs i>u{position:absolute;inset:0;background:var(--volt);transform-origin:right;transform:scaleX(0)}
#segs i.r>u{background:var(--amber)}
.pctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.pctl .btn{flex:1;min-width:84px;min-height:44px;padding:8px 10px}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,18,20,.82);text-align:center;padding:24px}
#overlay .box{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:460px}
#overlay .count{font-family:var(--f-display);font-size:5rem;font-weight:900;color:var(--volt);line-height:1}
#sideMap{display:flex;flex-direction:column;gap:6px}
#sideMap .mmap{max-width:240px}
@media (max-width:820px),(orientation:portrait){
  #player{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto auto}
  #side{border-inline-start:0;border-top:1px solid var(--line);padding:12px 16px 6px;gap:6px;max-height:50vh}
  #exName{font-size:1.45rem}
  #exCues{font-size:.92rem}
  #sideMap .mmap{max-width:190px}
}
</style>
</head>
<body>


<div id="app"></div>
<div id="player" hidden>
  <div id="stage">
    <canvas id="cv" aria-label="אווטאר מדגים את התרגיל"></canvas>
    <div id="hudL"><div class="lbl" id="hudLl">זמן</div><div class="big" id="hudLv">0</div></div>
    <div id="hudR"><div class="lbl" id="hudRl">חזרות</div><div class="big" id="hudRv">0</div></div>
    <div id="ring"><svg viewBox="0 0 100 100" width="100%" height="100%"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ringFg" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="0"/></svg><div id="ringTxt">0:00</div></div>
    <div id="bigCount" hidden></div>
    <div id="restBanner" hidden><div class="k">מנוחה · הבא בתור</div><div class="n" id="rbName"></div><div class="t" id="rbT"></div></div>
    <div id="overlay" hidden><div class="box" id="overlayBox"></div></div>
  </div>
  <div id="side">
    <div class="row" style="justify-content:space-between"><span id="phase">עבודה</span><span class="small muted num" id="stepOf"></span></div>
    <h2 id="exName">—</h2>
    <div id="exTarget"></div>
    <p id="exRom" class="small"></p>
    <ul id="exCues" class="bul"></ul>
    <p id="exWhy"></p>
    <div id="sideMap"></div>
    <a id="exVid" class="small" href="#" target="_blank" rel="noopener">הדגמה בווידאו של מאמן אמיתי (נפתח ביוטיוב)</a>
    <div class="pctl">
      <button class="btn" id="bPrev">הקודם</button>
      <button class="btn primary" id="bPause">השהה</button>
      <button class="btn" id="bNext">הבא</button>
      <button class="btn ghost" id="bSound">קול: פועל</button>
      <button class="btn ghost" id="bExit">יציאה</button>
    </div>
  </div>
  <div id="segs"></div>
</div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="home">בית</button>
  <button data-tab="moves">תרגילים</button>
  <button data-tab="progress">התקדמות</button>
  <button data-tab="settings">הגדרות</button>
</nav>

<script>
"use strict";
/* =====================================================================
   MATH + BODY MODEL
   World: floor y=0, person faces +z, x>0 = person's right. Meters.
   ===================================================================== */
const PI=Math.PI,D2=PI/2;
const V={add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],len:a=>Math.hypot(a[0],a[1],a[2]),
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]};
V.norm=a=>{const l=V.len(a)||1;return V.mul(a,1/l);};
const rX=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0],v[1]*c-v[2]*s,v[1]*s+v[2]*c];};
const rY=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c+v[2]*s,v[1],-v[0]*s+v[2]*c];};
const rZ=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]];};
function rod(v,k,t){const c=Math.cos(t),s=Math.sin(t),d=V.dot(k,v),x=V.cross(k,v);return[v[0]*c+x[0]*s+k[0]*d*(1-c),v[1]*c+x[1]*s+k[1]*d*(1-c),v[2]*c+x[2]*s+k[2]*d*(1-c)];}
const B={hip:.09,tor:.46,sh:.19,ua:.30,fa:.28,th:.44,sn:.43,ft:.19};
function ik2(S,T,l1,l2,pole){
  let d=V.sub(T,S),dl=V.len(d);const mx=l1+l2-.003;
  if(dl>mx){d=V.mul(d,mx/dl);dl=mx;T=V.add(S,d);}if(dl<.04)dl=.04;
  const dir=V.norm(d);const ca=Math.min(1,Math.max(-1,(l1*l1+dl*dl-l2*l2)/(2*l1*dl))),sa=Math.sqrt(1-ca*ca);
  let p=V.sub(pole,V.mul(dir,V.dot(pole,dir)));if(V.len(p)<1e-4)p=[0,0,1];p=V.norm(p);
  return{M:V.add(S,V.add(V.mul(dir,l1*ca),V.mul(p,l1*sa))),T};
}
const DEFP={rx:0,ry:.94,rz:0,pitch:0,yaw:0,roll:0,spine:0,tw:0,head:0,side:0,shrug:0,
  aR:{f:0,a:.12,e:.15},aL:{f:0,a:.12,e:.15},lR:{f:0,a:.04,k:0,an:0},lL:{f:0,a:.04,k:0,an:0}};
const LIMBS=["aR","aL","lR","lL"];
function mergeP(base,k){const o=Object.assign({},base);for(const f in k){if(f==="t")continue;if(LIMBS.includes(f)){o[f]=k[f].ik?{ik:k[f].ik.slice(),fp:k[f].fp||0,loc:k[f].loc||0}:Object.assign({},(base[f]&&!base[f].ik)?base[f]:{},k[f]);}else o[f]=k[f];}return o;}
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function lerpP(a,b,t){const o={};for(const f in a){const x=a[f],y=b[f];if(typeof x==="number")o[f]=lerp(x,y,t);else if(LIMBS.includes(f)){
  if(x.ik&&y.ik)o[f]={ik:[0,1,2].map(i=>lerp(x.ik[i],y.ik[i],t)),fp:lerp(x.fp||0,y.fp||0,t),loc:x.loc};
  else if(!x.ik&&!y.ik){o[f]={};for(const q in x)o[f][q]=lerp(x[q],y[q]??x[q],t);}
  else o[f]=t<.5?x:y;}}return o;}
function mirrorP(p){const o=JSON.parse(JSON.stringify(p));o.rx=-o.rx;o.yaw=-o.yaw;o.roll=-o.roll;o.tw=-o.tw;o.side=-(o.side||0);
  for(const [a,b] of [["aR","aL"],["lR","lL"]]){const A=o[a],Bq=o[b];o[a]=Bq;o[b]=A;for(const k of[a,b])if(o[k].ik)o[k].ik[0]=-o[k].ik[0];}return o;}

function skeleton(p,ex){
  const up=v=>rY(rX(rZ(v,p.roll),p.pitch),p.yaw);
  const W=v=>V.add(up(v),[p.rx,p.ry,p.rz]);
  const U=v=>rX(rY(rZ(v,p.side||0),p.tw),p.spine);
  const J={};
  J.pel=W([0,0,0]);J.belly=W(U([0,.10,0]));J.chest=W(U([0,.36,0]));J.neck=W(U([0,.49,0]));

  const W=done.filter(w=>w.res==="w").length,Dd=done.filter(w=>w.res==="d").length,Lo=done.filter(w=>w.res==="l").length;
  const ms=st.moods.slice(-14),avg=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null;
  app.innerHTML=`<section class="view"><h1>התקדמות</h1>
   <div class="stats"><div class="stat"><span class="v num">${st.sessions}</span><span class="k">אימונים</span></div><div class="stat"><span class="v num">${st.reps}</span><span class="k">חזרות</span></div><div class="stat"><span class="v num">${st.best}</span><span class="k">שיא רצף</span></div></div>
   <div class="panel"><div class="row" style="justify-content:space-between"><h3>העונה: ${LEAGUES[st.tier]}</h3><span class="small muted num">${W}-${Dd}-${Lo} (נ-ת-ה)</span></div>
     <p class="small muted">כל שבוע הוא מחזור. ${st.goal} אימונים = ניצחון, 3 נק'. אימון אחד פחות = תיקו, נק' אחת. כל 4 מחזורים: 8 נקודות ומעלה מעלות ליגה, פחות מ-4 מורידות.</p>
     <p class="small"><b class="num">${st.blockPts}</b> נקודות בסבב הנוכחי (מחזור ${st.block.length} מתוך 4).</p>
     <div style="overflow-x:auto"><table class="table"><thead><tr><th>מחזור</th><th>שבוע</th><th>אימונים</th><th>חזרות</th><th>תוצאה</th><th>נק'</th></tr></thead><tbody>${rows}</tbody></table></div></div>
   <div class="panel"><h3>מה האימון עושה לאנרגיה שלך</h3>${ms.length?`<div class="spark">${ms.map(m=>`<i class="${m<0?"neg":""}" style="height:${Math.max(4,Math.abs(m)*25+4)}%"></i>`).join("")}</div><p class="small muted">שינוי ממוצע בין לפני לאחרי: <b class="num">${avg>0?"+":""}${avg.toFixed(1)}</b> בסולם 1–5.</p>`:`<p class="small muted">דרג אנרגיה לפני ואחרי האימון, וכאן יופיע הגרף.</p>`}</div>
   <div class="panel"><h3>הישגים</h3><div class="badges">${ACH.map(a=>`<div class="badge ${a[3](st)?"on":""}"><b>${a[1]}</b><span class="small muted">${a[2]}</span></div>`).join("")}</div></div></section>`;
}
const LIMS=[["shoulder","כאב או מגבלה בכתף"],["knee","רגישות בברכיים (בלי קפיצות ולאנג'ים)"],["back","רגישות בגב התחתון"],["wrist","כאב בפרקי הידיים (בלי משען על כפות הידיים)"]];
function settings(){
  const pr=S.profile,L=pr.limits||{};
  app.innerHTML=`<section class="view"><h1>הגדרות</h1>
   <div class="panel"><h3>רמה</h3><div class="field"><label for="sLvl">רמת אימון</label><select id="sLvl">${[1,2,3].map(n=>`<option value="${n}" ${n===(pr.level||1)?"selected":""}>${LEVELS[n].name}: ${LEVELS[n].w} שנ' עבודה / ${LEVELS[n].r} מנוחה</option>`).join("")}</select></div>
     <p class="small muted">הרמה משתנה גם לבד: שתי תשובות "קל מדי" ברצף מעלות רמה, שתיים "קשה מדי" מורידות.</p></div>
   <div class="panel"><h3>ההרגל</h3><div class="field"><label for="sAnchor">אחרי ש... (העוגן היומי)</label><input type="text" id="sAnchor" value="${esc(pr.anchor)}"></div>
     <div class="field"><label for="sTime">שעת האימון</label><input type="time" id="sTime" value="${esc(pr.time)}"></div>
     <div class="field"><label for="sGoal">יעד שבועי</label><select id="sGoal">${[3,4,5,6,7].map(n=>`<option ${n===pr.goal?"selected":""}>${n}</option>`).join("")}</select></div></div>
   <div class="panel"><h3>הגוף שלי</h3>${LIMS.map(([k,l])=>`<label class="opt"><input type="checkbox" id="lim_${k}" ${L[k]?"checked":""}><span>${l}</span></label>`).join("")}<p class="small muted">תרגילים בעייתיים מוחלפים אוטומטית בחלופות בטוחות.</p></div>
   <div class="panel"><h3>קול ומוזיקה</h3>
     <label class="opt"><input type="checkbox" id="sVoice" ${pr.voice!==false?"checked":""}><span>הנחיות קוליות בעברית</span></label>
     <label class="opt"><input type="checkbox" id="sCount" ${pr.count===true?"checked":""}><span>ספירת חזרות בקול (במקום הנחיות קצרות)</span></label>
     <label class="opt"><input type="checkbox" id="sMusic" ${pr.music!==false?"checked":""}><span>מוזיקה אלקטרונית קצבית (מקורית, נוצרת בזמן אמת)</span></label>
     <div class="field"><label for="sVol">עוצמת מוזיקה</label><input type="range" id="sVol" min="0" max="1" step="0.05" value="${pr.vol??.6}"></div>
     <p class="small muted">אין קול באייפון? בדוק שמתג השקט כבוי.</p></div>
   <div class="panel"><h3>העברת התקדמות בין מכשירים</h3><textarea id="sCode" rows="3" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea><div class="row"><button class="btn" id="sCopy">העתק קוד</button></div>
     <div class="field"><label for="sImport">הדבק קוד ממכשיר אחר</label><textarea id="sImport" rows="2"></textarea></div><div class="row"><button class="btn" id="sDoImport">טען התקדמות</button></div></div>
   <div class="panel"><h3>בטיחות</h3>${SAFETY}</div>
   <div class="panel"><h3>איפוס</h3><div class="row"><button class="btn" id="sReset">מחק את כל הנתונים</button></div><p class="small muted" id="resetMsg"></p></div></section>`;
  const upd=()=>{pr.level=+$("#sLvl").value;pr.anchor=$("#sAnchor").value.trim()||pr.anchor;pr.time=$("#sTime").value;pr.goal=+$("#sGoal").value;pr.limits={};LIMS.forEach(([k])=>pr.limits[k]=$("#lim_"+k).checked);
    pr.voice=$("#sVoice").checked;pr.count=$("#sCount").checked;pr.music=$("#sMusic").checked;pr.vol=+$("#sVol").value;save();};
  app.querySelectorAll("input,select").forEach(el=>el.addEventListener("change",upd));
  $("#sCopy").onclick=()=>{const t=$("#sCode");navigator.clipboard.writeText(t.value).then(()=>toast("הקוד הועתק"),()=>{t.select();toast("סמן והעתק ידנית");});};
  $("#sDoImport").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#sImport").value.trim()))));if(!o.profile||!Array.isArray(o.log))throw 0;S=o;save();toast("ההתקדמות נטענה");render();}catch(e){toast("הקוד לא תקין. העתק אותו שוב במלואו.");}};
  let armed=false;$("#sReset").onclick=()=>{if(!armed){armed=true;$("#resetMsg").textContent="לחיצה נוספת תמחק את כל ההיסטוריה במכשיר הזה.";$("#sReset").textContent="כן, למחוק";return;}S=JSON.parse(JSON.stringify(DEF));save();tab="home";render();};
}
const SAFETY=`<ul class="bul small">
  <li>כיסא יציב <b>בלי גלגלים</b>, עם המשענת צמודה לקיר כשנשענים עליו בדחיפה.</li>
  <li>משטח לא חלק, נעליים או רגליים יחפות. לא בגרביים על פרקט.</li>
  <li>כאב חד, סחרחורת, לחץ בחזה או קוצר נשימה חריג: עוצרים מיד.</li>
  <li>מחלת לב, לחץ דם לא מאוזן, ניתוח בחצי השנה האחרונה או פציעה פעילה: להתייעץ עם רופא לפני שמתחילים.</li>
  <li>לא עוצרים נשימה. נושפים במאמץ.</li>
  <li>האפליקציה היא תוכנית אימון כללית ואינה ייעוץ רפואי.</li></ul>`;
const OB={anchor:"אני שותה כוס מים ראשונה",time:"07:00",goal:5,limits:{},push:1,plank:1};
function onboarding(step){
  $("#tabs").hidden=true;
  const q=(id,label,opts,cur)=>`<div class="field"><span>${label}</span><div class="scale three" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" aria-pressed="${v===cur}"><b>${l}</b></button>`).join("")}</div></div>`;
  const steps=[
    ()=>`<div class="label">שלב 1 מתוך 4</div><h1>10 דקות בבוקר. כיסא אחד.</h1>
      <p>אימון אינטרוולים מהכיסא: בטן ומותניים, ידיים, כתפיים, טרפז וגב, ופעם בשלושה ימים גם רגליים וחזה עם משקל גוף. מוזיקה קצבית, מאמן קולי, ספירה לאחור בין תרגילים.</p>
      <div class="panel"><h3>איך זה בנוי כדי שתתמיד</h3><ul class="bul small">
        <li><b>אפס חיכוך:</b> כפתור אחד. גם 2 דקות ביום עמוס נספרות.</li>
        <li><b>ליגה שבועית:</b> כל שבוע הוא מחזור מול היעד שלך, עם עלייה וירידה ליגה.</li>
        <li><b>3 ימי אימון מתחלפים</b> ו-3 רמות. הקושי מתאים את עצמו לפי המשוב שלך.</li>
        <li><b>לא מפספסים פעמיים:</b> יום אחד שהתפספס לא שובר את הרצף.</li></ul></div>`,
    ()=>`<div class="label">שלב 2 מתוך 4</div><h1>בטיחות</h1>${SAFETY}<label class="opt"><input type="checkbox" id="obSafe"><span>קראתי, ואני מתאמן באחריותי</span></label>`,
    ()=>`<div class="label">שלב 3 מתוך 4</div><h1>נקודת פתיחה</h1><p class="muted">שתי שאלות כדי לקבוע רמה. אפשר לשנות בכל רגע.</p>
      ${q("qPush","כמה שכיבות סמיכה רצופות על הרצפה אתה עושה היום?",[[1,"0–5"],[2,"6–15"],[3,"16+"]],OB.push)}
      ${q("qPlank","כמה אתה מתאמן היום?",[[1,"כמעט לא"],[2,"1–2 בשבוע"],[3,"3+ בשבוע"]],OB.plank)}
      <h3>מגבלות</h3>${LIMS.map(([k,l])=>`<label class="opt"><input type="checkbox" id="ob_${k}" ${OB.limits[k]?"checked":""}><span>${l}</span></label>`).join("")}`,
    ()=>`<div class="label">שלב 4 מתוך 4</div><h1>החוזה שלך</h1><p class="muted">הרגל נדבק לפעולה שכבר קורה כל בוקר. בחר עוגן קבוע.</p>
      <div class="field"><label for="obAnchor">אחרי ש...</label><input type="text" id="obAnchor" value="${esc(OB.anchor)}"></div>
      <div class="chips">${["אני שותה כוס מים ראשונה","אני מצחצח שיניים","אני מתלבש","אני מכין קפה"].map(a=>`<button class="chip" data-a="${a}">${a}</button>`).join("")}</div>
      <div class="field"><label for="obTime">בערך באיזו שעה?</label><input type="time" id="obTime" value="${OB.time}"></div>
      <div class="field"><label for="obGoal">יעד שבועי</label><select id="obGoal">${[3,4,5,6,7].map(n=>`<option value="${n}" ${n===OB.goal?"selected":""}>${n} אימונים בשבוע${n===5?" (מומלץ)":""}</option>`).join("")}</select></div>
      <div class="contract" id="obContract"></div>`];
  app.innerHTML=`<section class="view">${steps[step]()}<div class="row"><button class="btn primary" id="obNext">${step<3?"המשך":"חתום והתחל"}</button>${step>0?`<button class="btn ghost" id="obBack">חזרה</button>`:""}</div></section>`;
  const sync=()=>{if($("#obAnchor")){OB.anchor=$("#obAnchor").value.trim()||OB.anchor;OB.time=$("#obTime").value;OB.goal=+$("#obGoal").value;$("#obContract").innerHTML=`אחרי ש<b>${esc(OB.anchor)}</b>, אני מתיישב על הכיסא ולוחץ "התחל". <b>${OB.goal}</b> פעמים בשבוע, בסביבות <b>${esc(OB.time)}</b>.`;}};
  if(step===3){sync();app.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",sync));app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{$("#obAnchor").value=b.dataset.a;sync();});}
  if(step===2){for(const [id,f] of [["qPush","push"],["qPlank","plank"]])document.querySelectorAll("#"+id+" button").forEach(b=>b.onclick=()=>{OB[f]=+b.dataset.v;document.querySelectorAll("#"+id+" button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));});}
  if(step===1){$("#obNext").disabled=true;$("#obSafe").onchange=e=>$("#obNext").disabled=!e.target.checked;}
  $("#obNext").onclick=()=>{
    if(step===2){OB.limits={};LIMS.forEach(([k])=>OB.limits[k]=$("#ob_"+k).checked);}
    if(step<3){onboarding(step+1);window.scrollTo(0,0);return;}
    sync();S.profile={created:Date.now(),anchor:OB.anchor,time:OB.time,goal:OB.goal,limits:OB.limits,level:Math.min(OB.push,OB.plank),voice:true,count:false,music:true,vol:.6};save();tab="home";render();};
  if($("#obBack"))$("#obBack").onclick=()=>onboarding(step-1);$("#obNext").focus({preventScroll:true});
}
try{const m=location.search.match(/fast=(\d+)/);if(m)PL.speed=+m[1];}catch(e){}
window.__PL=PL;window.__EX=EX;
render();
</script>
